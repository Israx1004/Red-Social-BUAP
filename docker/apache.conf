<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    # La app vive en /RedSocial_BUAP (ver BASE_PATH en backend/shared/helpers.php)
    RedirectMatch ^/$ /RedSocial_BUAP/

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Proxy WebSocket to Node.js (opcional: el cliente también puede ir directo a :3001)
    ProxyPass /socket.io/ ws://websocket:3001/socket.io/
    ProxyPassReverse /socket.io/ ws://websocket:3001/socket.io/

    ErrorLog ${APACHE_LOG_DIR}/unilink_error.log
    CustomLog ${APACHE_LOG_DIR}/unilink_access.log combined
</VirtualHost>
