# ================================================================
# UniLink — Docker Compose
# Ejecutar desde la carpeta docker/:   docker compose --env-file ../.env up -d --build
# App:        http://localhost:8080/RedSocial_BUAP/
# WebSocket:  http://localhost:3001  (opcional)
#
# El código usa UNA sola base MySQL (red_social), igual que en XAMPP.
# ================================================================

services:

  # ---- API Gateway + Frontend (Apache/PHP con pdo_mysql) ----
  web:
    build:
      context: .
      dockerfile: php.Dockerfile
    container_name: unilink_web
    ports:
      - "8080:80"
    volumes:
      # La app espera vivir en /RedSocial_BUAP (BASE_PATH)
      - ..:/var/www/html/RedSocial_BUAP
      - ./apache.conf:/etc/apache2/sites-enabled/000-default.conf:ro
    environment:
      APP_ENV: ${APP_ENV:-production}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en ../.env}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-unilink}
      DB_PASS: ${DB_PASS:-securepassword}
      DB_NAME: red_social
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redissecret}
      BASE_PATH: /RedSocial_BUAP
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - unilink_net
    restart: unless-stopped

  # ---- Base de datos (MySQL 8) ----
  db:
    image: mysql:8.0
    container_name: unilink_db
    environment:
      MYSQL_DATABASE: red_social
      MYSQL_USER: ${DB_USER:-unilink}
      MYSQL_PASSWORD: ${DB_PASS:-securepassword}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
      # Se importa automáticamente la primera vez (volumen vacío)
      - ../red_social.sql:/docker-entrypoint-initdb.d/01_red_social.sql:ro
      - ../database/migration_mensajes.sql:/docker-entrypoint-initdb.d/02_mensajes.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - unilink_net
    restart: unless-stopped
    # Sin puerto expuesto: solo accesible dentro de la red de Docker

  # ---- Redis: rate limiting, cola de trabajos, adaptador de Socket.io ----
  redis:
    image: redis:7-alpine
    container_name: unilink_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redissecret} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - unilink_net
    restart: unless-stopped

  # ---- WebSocket Server (Node.js + Socket.io, opcional) ----
  websocket:
    build:
      context: ../websocket-server
      dockerfile: Dockerfile
    container_name: unilink_ws
    ports:
      - "3001:3001"
    environment:
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en ../.env}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redissecret}@redis:6379
      PORT: 3001
      ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    depends_on:
      - redis
    networks:
      - unilink_net
    restart: unless-stopped

  # ---- Worker de cola (correos de bienvenida / recuperación) ----
  queue_worker:
    build:
      context: .
      dockerfile: php.Dockerfile
    container_name: unilink_queue
    command: php /app/backend/queue/worker.php
    volumes:
      - ..:/app
    environment:
      APP_URL: ${APP_URL:-http://localhost:8080/RedSocial_BUAP}
      DB_HOST: db
      DB_USER: ${DB_USER:-unilink}
      DB_PASS: ${DB_PASS:-securepassword}
      DB_NAME: red_social
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redissecret}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - unilink_net
    restart: unless-stopped

volumes:
  db_data:
  redis_data:

networks:
  unilink_net:
    driver: bridge
